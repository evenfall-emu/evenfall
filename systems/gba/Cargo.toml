[package]
name = "evenfall-gba"
description = "A deterministic, cycle-aware Game Boy Advance core"
default-run = "evenfall-gba"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
scanline-memo-check = []

[dependencies]
blake3.workspace = true
evenfall-audio.workspace = true
evenfall-cpu-arm.workspace = true
evenfall-host.workspace = true
evenfall-state.workspace = true
miniz_oxide.workspace = true
sha1 = "0.10"
sha2 = "0.10"
wide.workspace = true

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "hot_paths"
harness = false

# The ROM validator prints one line per case and selects cases by name, so it
# runs without libtest. Every other file in tests/ is discovered automatically.
[[test]]
name = "validator"
path = "tests/validator/main.rs"
harness = false

[lints]
workspace = true
