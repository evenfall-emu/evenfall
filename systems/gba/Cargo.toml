[package]
name = "evenfall-gba"
description = "A deterministic, cycle-aware Game Boy Advance core"
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
scanline-memo-check = []

[dependencies]
blake3.workspace = true
evenfall-audio.workspace = true
evenfall-cpu-arm.workspace = true
evenfall-host.workspace = true
evenfall-state.workspace = true
miniz_oxide.workspace = true
sha1 = "0.10"
sha2 = "0.10"

[dev-dependencies]
divan.workspace = true

[[bench]]
name = "hot_paths"
harness = false

[[test]]
name = "validator"
path = "tests/validator.rs"
harness = false

[[test]]
name = "mgba_suite_source"
path = "tests/mgba_suite_source.rs"

[[test]]
name = "mgba_suite_timing"
path = "tests/mgba_suite_timing.rs"

[lints]
workspace = true
