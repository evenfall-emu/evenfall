name: Feature request
description: Propose new hardware coverage, an API, or a host feature.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't you do today, and who needs it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: For hardware behavior, cite the evidence (manual, GBATEK section, test ROM, hardware observation).
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
