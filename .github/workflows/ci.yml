name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    name: Rust tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The ROM validator is run with real inputs in its dedicated Linux job.
      - run: cargo test --workspace --exclude evenfall-gba --locked
      - run: cargo test -p evenfall-gba --locked --lib --bins --test mgba_suite_source --test mgba_suite_timing

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --exclude evenfall-gba --release --locked
      - run: cargo test -p evenfall-gba --release --locked --lib --bins --test mgba_suite_source --test mgba_suite_timing

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - run: cargo build --locked -p evenfall-gba --lib --target wasm32-unknown-unknown

  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - run: npm ci --no-audit --no-fund
      # The pinned local Vite+ CLI, so the steps below match the documented commands.
      - run: echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp fmt --check
      - run: vp check
      - run: npm run build:wasm -w @evenfall/gba
      - run: vp test

  browser:
    name: Player in Chromium
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.11.0
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build:wasm -w @evenfall/gba
      - run: npm run build -w @evenfall/player
      # Both suites serve web/player/dist on the same port, so run them in turn.
      - run: npm run test:browser -w @evenfall/player
      - run: npm run test:browser -w @evenfall/gba-game-plugins

  cloudflare:
    name: Cloudflare build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      # The same script and dry runs as the Workers Builds projects.
      - run: bash web/cloudflare/build.sh
      - run: npx wrangler deploy --dry-run --config web/cloudflare/wrangler.jsonc

  validators:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.local/share/evenfall-toolchains/arm-gnu-toolchain-15.2.Rel1
          key: linux-x64-arm-gnu-15.2.Rel1
      - name: Install pinned Arm GNU toolchain
        run: |
          set -euo pipefail
          toolchain="$HOME/.local/share/evenfall-toolchains/arm-gnu-toolchain-15.2.Rel1"
          if [ ! -x "$toolchain/bin/arm-none-eabi-gcc" ]; then
            mkdir -p "$toolchain"
            curl -fLsS https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi.tar.xz -o "$RUNNER_TEMP/arm.tar.xz"
            echo "597893282ac8c6ab1a4073977f2362990184599643b4c5ee34870a8215783a16  $RUNNER_TEMP/arm.tar.xz" | sha256sum -c -
            tar -xJf "$RUNNER_TEMP/arm.tar.xz" -C "$toolchain" --strip-components=1
          fi
          echo "$toolchain/bin" >> "$GITHUB_PATH"
      - run: tools/setup-refs.sh gba-tests
      - run: make -C probe -j2
      - run: cargo test --locked -p evenfall-gba --test validator -- --require-roms
