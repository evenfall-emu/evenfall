[package]
name = "evenfall-present"
description = "Host-side presentation of emulated frames: aspect-correct scaling presets drawn with wgpu"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
evenfall-host.workspace = true
wgpu = { workspace = true, features = ["std", "wgsl"] }

[dev-dependencies]
# The tests draw on whatever native adapter the machine offers, software
# rasterizers included. Each backend feature is inert off its own platform.
wgpu = { workspace = true, features = ["vulkan", "metal", "dx12", "gles"] }

[lints]
workspace = true
