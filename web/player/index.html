<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#073659" />
    <title>Evenfall</title>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="/src/assets/brand/evenfall-icon.svg"
    />
    <!-- Browsers without SVG favicons, and the iOS home screen, need a bitmap. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/src/assets/brand/evenfall-icon-32.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/src/assets/brand/evenfall-icon-180.png"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
