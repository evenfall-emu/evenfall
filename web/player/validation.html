<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Evenfall browser validation · RUNNING</title>
  <style>
    body {
      margin: 0;
      background: #101613;
      color: #dce8d5;
      font: 13px monospace;
    }
    pre {
      padding: 20px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
  <script>
    if (!new URL(location.href).searchParams.has("sdk-only")) {
      window.validationToken = crypto.randomUUID();
      const hold = new Image();
      hold.src = "/__validation_hold__?token=" + window.validationToken;
      hold.hidden = true;
      document.documentElement.append(hold);
    }
  </script>
  <pre id="result">RUNNING</pre>
  <script type="module" src="/src/validation.js"></script>
</html>
