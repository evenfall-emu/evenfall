[package]
name = "evenfall-present-web"
description = "Browser host of evenfall-present: draws frames into a canvas through WebGPU"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

# The module only means something in a browser. Native workspace builds
# compile an empty library.
[target.'cfg(target_arch = "wasm32")'.dependencies]
evenfall-host.workspace = true
evenfall-present.workspace = true
js-sys = "0.3.106"
wasm-bindgen = "0.2.129"
wasm-bindgen-futures = "0.4.79"
web-sys = { version = "0.3", features = ["HtmlCanvasElement"] }
wgpu = { workspace = true, features = ["webgpu"] }

[lints]
workspace = true
